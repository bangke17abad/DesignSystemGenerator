<!-- Image fixture · variants (content, figure, decorative, thumbnail), states (loading, loaded, error, focus, hover), ratios from aspect-* tokens,
     zoom (Modal), mandatory combinations and edge cases. Images are inline SVG data URIs: no external files, no network.
     The error demos use an invalid data: URI or an empty src, so the failure is immediate and local. Without JS a failed image
     shows the browser's own alt text inside the reserved frame; Image.js swaps in the fallback (icon + visible alt). -->
