<!-- SegmentedControl fixture · variants, sizes, states, mandatory combinations (catalog preview) + edge cases.
     single = fieldset > legend + native radios (arrows, one Tab stop, forms work without JS); the input covers its segment.
     multiple = the same segments with native checkboxes: catalog html hint names div[role=group] > button[aria-pressed], which needs JS to
     toggle (§6.4); checkboxes keep the toggle semantics (checked = pressed) without JS. SegmentedControl.js gives multiple one Tab stop.
     JS adds blocked segments (reachable, never selected, reason announced), Home/End, icon-only Tooltips and the phone Select sync. -->
