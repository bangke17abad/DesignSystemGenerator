<section class="ds-demo" data-ds-demo="select-all (one child blocked) + group error">

      <div class="ds-checkbox-group__items">

          <label class="ds-checkbox"><span class="ds-checkbox__control"><input class="ds-checkbox__input" id="cb-sa1" type="checkbox" name="report" value="sales" checked><svg class="ds-icon ds-checkbox__mark" data-mark="check" aria-hidden="true"><use href="#ds-i-check"/></svg><svg class="ds-icon ds-checkbox__mark" data-mark="mixed" aria-hidden="true"><use href="#ds-i-minus"/></svg></span><span class="ds-checkbox__text"><span class="ds-checkbox__label">Sales</span></span></label>
          <label class="ds-checkbox"><span class="ds-checkbox__control"><input class="ds-checkbox__input" id="cb-sa2" type="checkbox" name="report" value="stock"><svg class="ds-icon ds-checkbox__mark" data-mark="check" aria-hidden="true"><use href="#ds-i-check"/></svg><svg class="ds-icon ds-checkbox__mark" data-mark="mixed" aria-hidden="true"><use href="#ds-i-minus"/></svg></span><span class="ds-checkbox__text"><span class="ds-checkbox__label">Stock levels</span></span></label>
          <label class="ds-checkbox"><span class="ds-checkbox__control"><input class="ds-checkbox__input" id="cb-sa3" type="checkbox" name="report" value="returns"><svg class="ds-icon ds-checkbox__mark" data-mark="check" aria-hidden="true"><use href="#ds-i-check"/></svg><svg class="ds-icon ds-checkbox__mark" data-mark="mixed" aria-hidden="true"><use href="#ds-i-minus"/></svg></span><span class="ds-checkbox__text"><span class="ds-checkbox__label">Returns</span></span></label>
          <label class="ds-checkbox"><span class="ds-checkbox__control"><input class="ds-checkbox__input" id="cb-sa4" type="checkbox" name="report" value="payroll" checked aria-disabled="true" aria-describedby="cb-sa4-r"><svg class="ds-icon ds-checkbox__mark" data-mark="check" aria-hidden="true"><use href="#ds-i-check"/></svg><svg class="ds-icon ds-checkbox__mark" data-mark="mixed" aria-hidden="true"><use href="#ds-i-minus"/></svg></span><span class="ds-checkbox__text"><span class="ds-checkbox__label">Payroll</span><span class="ds-checkbox__description" id="cb-sa4-r"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-restricted"/></svg><span>Always included for finance admins.</span></span></span></label>

      </div>

    <fieldset class="ds-checkbox-group" data-invalid data-ds-module="checkbox" aria-describedby="cb-ge-help cb-ge-err" style="grid-column: span 4">
      <legend class="ds-checkbox-group__legend">Contact preferences</legend>

      </div>
      <p class="ds-checkbox__error" id="cb-ge-err"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-critical"/></svg><span>Select at least one contact preference</span></p>
